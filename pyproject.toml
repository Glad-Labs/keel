[project]
name = "keel"
version = "0.1.0"
description = "A journal that talks back, running on your own machine. Nothing leaves it."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Search by meaning, on the CPU. Without it Keel searches by keyword.
embed = ["fastembed>=0.4"]
# Speech in and out, on the CPU. faster-whisper 1.2.1 fails on PyAV 19 (seen 2026-10-06); 15 works.
voice = ["faster-whisper>=1.1", "kokoro-onnx>=0.4", "av>=11,<16"]

[project.scripts]
keel = "keel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["keel"]

[tool.setuptools.package-data]
keel = ["RULES.md", "web/*"]
