<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<title>Keel</title>
<style>
:root {
  --bg: #f5f2ec;
  --surface: #ebe6dc;
  --text: #1d2125;
  --muted: #565c64;
  --faint: #7a8089;
  --accent: #8f6229;
  --accent-soft: rgba(143, 98, 41, 0.14);
  --ring: rgba(29, 33, 37, 0.16);
  --danger: #a3372d;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116;
    --surface: #171b22;
    --text: #e9e6df;
    --muted: #a5aab1;
    --faint: #7c828a;
    --accent: #d4ab6e;
    --accent-soft: rgba(212, 171, 110, 0.15);
    --ring: rgba(233, 230, 223, 0.16);
    --danger: #e8877c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
main {
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
header { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
.brand { font-weight: 600; letter-spacing: 0.02em; }
.mode { font-size: 13px; color: var(--muted); border: 1px solid var(--ring); border-radius: 999px; padding: 2px 10px; }
.mode[hidden] { display: none; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 320px; }
#talk {
  width: min(58vw, 216px);
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid var(--ring);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 17px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  position: relative;
  transition: transform 0.15s ease, background-color 0.2s ease;
}
#talk::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 2px solid transparent;
  transition: border-color 0.2s ease;
}
#talk:focus-visible { outline: 2px solid var(--accent); outline-offset: 14px; }
#talk[data-state="listening"] { background: var(--accent-soft); transform: scale(1.04); }
#talk[data-state="listening"]::after { border-color: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
#talk[data-state="thinking"]::after { border-color: var(--ring); animation: breathe 2.4s ease-in-out infinite; }
#talk[data-state="speaking"]::after { border-color: var(--accent); opacity: 0.55; }
@keyframes pulse { 50% { transform: scale(1.06); opacity: 0.45; } }
@keyframes breathe { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) {
  #talk, #talk::after { animation: none !important; transition: none !important; }
}
#status { margin: 0; color: var(--muted); min-height: 3.1em; text-align: center; max-width: 34ch; }
#status.error { color: var(--danger); }
.exchange { display: grid; gap: 12px; min-height: 0; }
.line { margin: 0; overflow-wrap: anywhere; }
.line[hidden] { display: none; }
.who { display: block; font-size: 12px; letter-spacing: 0.04em; color: var(--faint); }
.you { color: var(--muted); }
form { display: flex; gap: 8px; }
input[type="text"] {
  flex: 1;
  min-width: 0;
  font: inherit;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--ring);
  background: var(--surface);
  color: var(--text);
}
input[type="text"]:focus-visible, .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.send { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--ring); background: transparent; color: var(--text); cursor: pointer; }
.hint { margin: 0; font-size: 13px; color: var(--faint); text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">Keel</span>
    <span id="mode" class="mode" hidden></span>
  </header>

  <section class="stage">
    <button id="talk" type="button" data-state="idle" aria-pressed="false" aria-describedby="status">Hold to talk</button>
    <p id="status" role="status" aria-live="polite">Hold to talk, or tap once to start and again to stop.</p>
  </section>

  <section class="exchange" aria-label="Last exchange">
    <p class="line you" id="you" hidden><span class="who">You</span><span></span></p>
    <p class="line keel" id="keel" hidden><span class="who">Keel</span><span></span></p>
  </section>

  <form id="typed" autocomplete="off">
    <label class="sr-only" for="text">Type instead</label>
    <input id="text" type="text" placeholder="Or type here" enterkeyhint="send">
    <button class="send" type="submit">Send</button>
  </form>
  <p class="hint">Nothing leaves your own devices.</p>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const talk = $("talk");
  const status = $("status");
  const modeChip = $("mode");
  const IDLE = "Hold to talk, or tap once to start and again to stop.";
  const LABELS = { idle: "Hold to talk", listening: "Listening", thinking: "Thinking", speaking: "Speaking" };

  let sid = null;
  try { sid = sessionStorage.getItem("keel-session"); } catch (e) {}
  if (!sid) {
    sid = window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    try { sessionStorage.setItem("keel-session", sid); } catch (e) {}
  }

  let stream = null, recorder = null, chunks = [];
  let held = false, toggled = false, pressedAt = 0, busy = false, player = null;

  function setState(state, text) {
    talk.dataset.state = state;
    talk.textContent = LABELS[state];
    talk.setAttribute("aria-pressed", String(state === "listening"));
    status.classList.remove("error");
    if (text !== undefined) status.textContent = text;
  }

  function showError(message) {
    setState("idle");
    status.textContent = message;
    status.classList.add("error");
  }

  function line(which, text) {
    const el = $(which);
    el.hidden = !text;
    el.lastElementChild.textContent = text || "";
  }

  function stopPlayback() {
    if (player) { player.pause(); player = null; }
  }

  async function startRecording() {
    stopPlayback();
    if (!window.isSecureContext || !navigator.mediaDevices || !window.MediaRecorder) {
      showError("The microphone only works on localhost or https. You can type below.");
      return false;
    }
    try {
      stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      showError("Keel can't use the microphone. Allow it in the browser's site settings, or type below.");
      return false;
    }
    const type = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t));
    recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.start();
    if (!held) toggled = true;
    setState("listening", toggled ? "Listening. Tap again when you're done." : "Listening. Let go when you're done.");
    return true;
  }

  function stopRecording() {
    return new Promise((resolve) => {
      if (!recorder || recorder.state === "inactive") return resolve(null);
      recorder.onstop = () => resolve(new Blob(chunks, { type: recorder.mimeType || "audio/webm" }));
      recorder.stop();
    });
  }

  async function finish() {
    toggled = false;
    const blob = await stopRecording();
    if (!blob || blob.size < 2000) return setState("idle", "That was too short. Hold a little longer.");
    send("/api/turn", blob, blob.type || "audio/webm");
  }

  async function send(path, body, contentType) {
    busy = true;
    setState("thinking", "Thinking.");
    try {
      const res = await fetch(path + "?session=" + encodeURIComponent(sid), {
        method: "POST",
        headers: { "Content-Type": contentType, "X-Keel": "1" },
        body,
      });
      const data = await res.json().catch(() => ({ error: "Something went wrong." }));
      if (!res.ok || data.error) return showError(data.error || "Something went wrong.");
      show(data);
    } catch (e) {
      showError("Can't reach Keel. Is keel serve running?");
    } finally {
      busy = false;
    }
  }

  function show(data) {
    line("you", data.you);
    line("keel", data.keel);
    modeChip.hidden = !data.mode || data.mode === "default";
    modeChip.textContent = data.mode && data.mode !== "default" ? data.mode : "";
    if (!data.audio) return setState("idle", IDLE);
    player = new Audio("data:" + data.audio_type + ";base64," + data.audio);
    player.onended = () => { player = null; setState("idle", IDLE); };
    setState("speaking", "");
    player.play().catch(() => { player = null; setState("idle", IDLE); });
  }

  talk.addEventListener("pointerdown", async (e) => {
    e.preventDefault();
    if (busy) return;
    if (recorder && recorder.state === "recording") return finish();
    held = true;
    toggled = false;
    pressedAt = performance.now();
    if (e.pointerId !== undefined && talk.setPointerCapture) {
      try { talk.setPointerCapture(e.pointerId); } catch (err) {}
    }
    await startRecording();
  });

  async function release() {
    if (!held) return;
    held = false;
    if (!recorder || recorder.state !== "recording" || toggled) return;
    if (performance.now() - pressedAt < 350) {
      toggled = true;
      status.textContent = "Listening. Tap again when you're done.";
      return;
    }
    finish();
  }
  talk.addEventListener("pointerup", release);
  talk.addEventListener("pointercancel", release);
  talk.addEventListener("contextmenu", (e) => e.preventDefault());

  const typing = () => document.activeElement === $("text");
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat || typing()) return;
    e.preventDefault();
    talk.dispatchEvent(new PointerEvent("pointerdown"));
  });
  document.addEventListener("keyup", (e) => {
    if (e.code !== "Space" || typing()) return;
    e.preventDefault();
    release();
  });

  $("typed").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (!text || busy) return;
    $("text").value = "";
    stopPlayback();
    send("/api/text", JSON.stringify({ text }), "application/json");
  });
})();
</script>
</body>
</html>
